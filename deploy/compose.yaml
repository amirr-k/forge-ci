name: forgeci

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: forgeci
      MYSQL_USER: forgeci
      MYSQL_PASSWORD: forgeci
      MYSQL_ROOT_PASSWORD: forgeci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uforgeci", "-pforgeci"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible local dev store. Production points FORGE_S3_ENDPOINT at real AWS S3 instead —
  # see docs/architecture.md for the production configuration.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forgeci
      MINIO_ROOT_PASSWORD: forgeci-artifact-store
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      FORGE_DB_URL: jdbc:mysql://mysql:3306/forgeci
      FORGE_DB_USER: forgeci
      FORGE_DB_PASSWORD: forgeci
      FORGE_S3_ENDPOINT: http://minio:9000
      FORGE_S3_BUCKET: forgeci-artifacts
      FORGE_S3_REGION: us-east-1
      FORGE_S3_ACCESS_KEY: forgeci
      FORGE_S3_SECRET_KEY: forgeci-artifact-store
      FORGE_S3_PATH_STYLE: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Both workers run docker-outside-of-docker (the mounted host socket) and share one named
  # volume as their workspace — see docs/architecture.md for why a named volume, not a bind
  # mount, is what makes task containers launched by a worker see the same files the worker does.
  worker-1: &worker
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
    environment: &worker-environment
      FORGE_CONTROL_PLANE_URL: http://control-plane:8080
      FORGE_WORKER_ID: worker-1
      FORGE_WORKER_MAX_CONCURRENCY: "2"
      FORGE_WORKSPACE_ROOT: /workspace
      FORGE_SEED_WORKSPACE_FROM: /opt/forge-demo-repo
      FORGE_WORKER_DOCKER_VOLUME: forgeci_worker-workspace
      FORGE_WORKER_DOCKER_IMAGE: alpine:3.20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-workspace:/workspace

  worker-2:
    <<: *worker
    environment:
      <<: *worker-environment
      FORGE_WORKER_ID: worker-2

volumes:
  minio-data:
  worker-workspace:
