name: forgeci

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: forgeci
      MYSQL_USER: forgeci
      MYSQL_PASSWORD: forgeci
      MYSQL_ROOT_PASSWORD: forgeci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uforgeci", "-pforgeci"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible local dev store. Production points FORGE_S3_ENDPOINT at real AWS S3 instead —
  # see docs/architecture.md for the production configuration.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forgeci
      MINIO_ROOT_PASSWORD: forgeci-artifact-store
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Single-node KRaft broker (no ZooKeeper) — durable event delivery for forge.task-ready,
  # forge.task-results, and forge.build-events. The control plane still works with this stopped;
  # only the Kafka mirror/consumer paths degrade, never the direct HTTP claim/report path.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Ephemeral only — heartbeat/lease acceleration cache, per
  # spec/reference/contracts.md#redis-responsibilities. The control plane reconciles this from
  # MySQL (the state of truth) on a schedule, so a flush or restart here never loses build state.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FORGE_DB_URL: jdbc:mysql://mysql:3306/forgeci
      FORGE_DB_USER: forgeci
      FORGE_DB_PASSWORD: forgeci
      FORGE_S3_ENDPOINT: http://minio:9000
      FORGE_S3_BUCKET: forgeci-artifacts
      FORGE_S3_REGION: us-east-1
      FORGE_S3_ACCESS_KEY: forgeci
      FORGE_S3_SECRET_KEY: forgeci-artifact-store
      FORGE_S3_PATH_STYLE: "true"
      FORGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FORGE_REDIS_HOST: redis
      FORGE_REDIS_PORT: "6379"
      FORGE_DEMO_REPO_PATH: /opt/forge-demo-repo
      FORGE_DEMO_WORKSPACE_PATH: /var/lib/forgeci/demo-workspace
      # the release pipeline sets this on the host before `compose up`; /api/version echoes it
      # back so a deploy can be verified against the commit it was supposed to deploy
      FORGE_GIT_COMMIT: ${FORGE_GIT_COMMIT:-unknown}
      # scheduler/recovery tuning, defaulted to application.yml's own values. The benchmark
      # harness overrides these per arm so one stack definition covers every measured
      # configuration instead of a fork of this file per experiment.
      FORGE_SCHEDULER_POLICY: ${FORGE_SCHEDULER_POLICY:-critical-path}
      FORGE_SCHEDULER_SPECULATION_ENABLED: ${FORGE_SCHEDULER_SPECULATION_ENABLED:-false}
      FORGE_SCHEDULER_SPECULATION_MULTIPLIER: ${FORGE_SCHEDULER_SPECULATION_MULTIPLIER:-1.5}
      FORGE_SCHEDULER_SPECULATION_MIN_ELAPSED_MS: ${FORGE_SCHEDULER_SPECULATION_MIN_ELAPSED_MS:-5000}
      FORGE_SCHEDULER_SPECULATION_MAX_PER_BUILD: ${FORGE_SCHEDULER_SPECULATION_MAX_PER_BUILD:-4}
      FORGE_WORKER_HEARTBEAT_INTERVAL_MS: ${FORGE_WORKER_HEARTBEAT_INTERVAL_MS:-2000}
      FORGE_SCHEDULER_LEASE_GRACE_SECONDS: ${FORGE_SCHEDULER_LEASE_GRACE_SECONDS:-30}
      FORGE_SCHEDULER_LEASE_SWEEP_INTERVAL_MS: ${FORGE_SCHEDULER_LEASE_SWEEP_INTERVAL_MS:-2000}
      FORGE_SCHEDULER_RETRY_SWEEP_INTERVAL_MS: ${FORGE_SCHEDULER_RETRY_SWEEP_INTERVAL_MS:-1000}
      FORGE_SCHEDULER_RECLAIM_RETRY_DELAY_MS: ${FORGE_SCHEDULER_RECLAIM_RETRY_DELAY_MS:-1000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Both workers run docker-outside-of-docker (the mounted host socket) and share one named
  # volume as their workspace — see docs/architecture.md for why a named volume, not a bind
  # mount, is what makes task containers launched by a worker see the same files the worker does.
  worker-1: &worker
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
    environment: &worker-environment
      FORGE_CONTROL_PLANE_URL: http://control-plane:8080
      FORGE_WORKER_ID: worker-1
      FORGE_WORKER_MAX_CONCURRENCY: ${FORGE_WORKER_MAX_CONCURRENCY:-2}
      FORGE_WORKSPACE_ROOT: /workspace
      # /opt/forge-scale-repo (the 150-task benchmark fixture) is also baked into the image; the
      # benchmark harness points this at it to measure the large graph instead of the demo one
      FORGE_SEED_WORKSPACE_FROM: ${FORGE_SEED_WORKSPACE_FROM:-/opt/forge-demo-repo}
      FORGE_WORKER_DOCKER_VOLUME: forgeci_worker-workspace
      # the bundled demo's tasks run real javac/java/jar, so the task sandbox needs a JDK
      FORGE_WORKER_DOCKER_IMAGE: eclipse-temurin:21-jdk-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-workspace:/workspace

  worker-2:
    <<: *worker
    environment:
      <<: *worker-environment
      FORGE_WORKER_ID: worker-2

  # Behind a profile so the default stack stays two workers — the four-worker benchmark arm
  # activates "scale-4" to bring these up, and nothing else ever starts them.
  worker-3:
    <<: *worker
    profiles: ["scale-4"]
    environment:
      <<: *worker-environment
      FORGE_WORKER_ID: worker-3

  worker-4:
    <<: *worker
    profiles: ["scale-4"]
    environment:
      <<: *worker-environment
      FORGE_WORKER_ID: worker-4

volumes:
  minio-data:
  worker-workspace:
