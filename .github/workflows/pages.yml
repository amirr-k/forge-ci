name: static demo

# Publishes the trace-replay showcase to GitHub Pages. The published site is fully static: it
# talks to no control plane, contacts no cloud resource, and runs no visitor-supplied code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      # a trace that does not validate must never reach the published page
      - name: validate committed traces
        run: node benchmarks/scripts/validate-traces.mjs

      - name: build static demo
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build --prefix ui

      # a build served under /<repo>/ but routed at "/" renders an empty page that still returns
      # 200 with the right title — only a browser check against the real base path catches it
      - name: verify the built demo actually renders
        run: |
          npx --prefix ui playwright install --with-deps chromium
          npx --prefix ui playwright test e2e/static-demo.spec.ts --config ui/playwright.config.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: smoke test the published page
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "checking $url"
          code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --retry 5 --retry-delay 5 "$url")
          test "$code" = "200" || { echo "expected 200, got $code"; exit 1; }

          # the JS bundle has to load from the published base path, and it has to carry the
          # traces — grepping index.html alone would pass on a page that renders nothing
          asset=$(grep -o '/[^"]*/assets/index-[A-Za-z0-9_-]*\.js' /tmp/page.html | head -1)
          test -n "$asset" || { echo "no JS bundle referenced by index.html"; exit 1; }
          origin=$(echo "$url" | sed -E 's#(https://[^/]+).*#\1#')
          code=$(curl -sS -o /tmp/bundle.js -w '%{http_code}' "$origin$asset")
          test "$code" = "200" || { echo "bundle $asset returned $code"; exit 1; }
          grep -q "leaf-module" /tmp/bundle.js || { echo "bundle carries no traces"; exit 1; }
