name: static demo

# Publishes the trace-replay showcase to GitHub Pages. The published site is fully static: it
# talks to no control plane, contacts no cloud resource, and runs no visitor-supplied code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      # a trace that does not validate must never reach the published page
      - name: validate committed traces
        run: node benchmarks/scripts/validate-traces.mjs

      - name: build static demo
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build --prefix ui

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: smoke test the published page
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "checking $url"
          code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --retry 5 --retry-delay 5 "$url")
          test "$code" = "200" || { echo "expected 200, got $code"; exit 1; }
          grep -q "ForgeCI" /tmp/page.html || { echo "page did not render the app shell"; exit 1; }
