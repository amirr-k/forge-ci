name: forgeci

on:
  pull_request:
    branches: [main]
  # also gate main directly: work that lands without a PR would otherwise never be checked
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # The full, unconditional gate every PR must pass. Deliberately independent of forge's own
  # affected-task selection (the plan-and-run job below): that job proves ForgeCI works on itself,
  # but a real CI gate can't rely on a change-detection heuristic to decide what to check — an
  # unrelated-looking edit that actually breaks a formatter rule or a distant module still has to
  # be caught. `./gradlew check` alone covers most of the required list: Spotless wires
  # spotlessCheck, the SpotBugs plugin wires spotbugsMain, and every subproject's `test` (core
  # unit/property tests, CLI integration tests, control-plane unit tests, the worker's real
  # Docker-executor tests) plus apps/control-plane's `integrationTest` (the Testcontainers suite:
  # MySQL/S3/Kafka/Redis, and — because it boots the app for real against that MySQL container —
  # migration validation) all hang off `check` already.
  required-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: java formatting, static analysis, and every JVM test suite
        run: ./gradlew check --continue

      - name: upload JVM test and analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-check-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/spotbugs/**
          if-no-files-found: ignore

      - run: npm ci --prefix ui

      - name: frontend lint and type checks
        run: |
          npm run lint --prefix ui
          npm run typecheck --prefix ui

      - name: frontend unit tests
        run: npm run test --prefix ui

      # the published demo and every benchmark figure read this format; a malformed or
      # self-contradicting trace has to fail here rather than on the public page
      - name: execution-trace schema validation
        run: node benchmarks/scripts/validate-traces.mjs

      - name: static demo builds with no backend
        env:
          VITE_STATIC_DEMO: "true"
        run: npm run build --prefix ui

  # container images must actually build from a clean checkout — a Dockerfile that only worked
  # because a developer's local build cache papered over a missing file is exactly what this catches
  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/control-plane/Dockerfile -t forgeci/control-plane:pr-check .
      - run: docker build -f apps/worker/Dockerfile -t forgeci/worker:pr-check .

  dependency-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # the one check that exercises the actual public demo through a real browser, against the real
  # multi-service stack (deploy/compose.yaml) — not a mock, not a static screenshot
  browser-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: start the full stack
        run: docker compose -f deploy/compose.yaml up --build -d

      - name: wait for the control plane to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/ready >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "control plane never became ready" >&2
          docker compose -f deploy/compose.yaml logs
          exit 1

      - run: npm ci --prefix ui
      - run: npx --prefix ui playwright install --with-deps chromium

      # Started and waited for in one step on purpose: `npx ... &` at the end of a step is not
      # reliably still running by the next one. It also has to run *from* ui/, or vite picks the
      # repository root as its project root and never finds ui/index.html or ui/vite.config.ts.
      - name: serve the ui against the live compose stack
        working-directory: ui
        env:
          FORGE_API_PROXY_TARGET: http://localhost:8080
        run: |
          npx vite --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "ui dev server is up"
              exit 0
            fi
            sleep 2
          done
          echo "ui dev server never came up" >&2
          cat /tmp/vite.log >&2
          exit 1

      - name: run the primary-demo browser test
        run: npm run e2e --prefix ui

      - name: dump compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs

      - if: always()
        run: docker compose -f deploy/compose.yaml down -v

  plan-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # node_modules is not itself a forge task output — ui:build/ui:test assume it already
      # exists, the same way they would in a developer's checkout.
      - run: npm ci --prefix ui

      # ForgeCI's own local cache (.forge/cache, gitignored) lives on disk keyed by content —
      # restoring it here is what lets a second, isolated CI run reuse artifacts a prior run
      # produced instead of rebuilding them from scratch.
      - uses: actions/cache@v4
        with:
          path: .forge/cache
          key: forgeci-local-cache-${{ github.run_id }}
          restore-keys: |
            forgeci-local-cache-

      # On a PR the interesting baseline is the merge base with the target branch. On a push to
      # main it is the commit that was there before — `github.base_ref` is empty for push events,
      # and an empty --base makes `forge run` exit non-zero on usage rather than build anything.
      - name: resolve base revision
        id: base
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            revision=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            before="${{ github.event.before }}"
            # zeroed on a branch's first push, and absent for workflow_dispatch
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              revision=$(git rev-parse HEAD~1)
            else
              revision="$before"
            fi
          fi
          echo "resolved base revision: $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: install (build the CLI)
        run: ./forge doctor

      - name: plan
        run: ./forge plan --base "${{ steps.base.outputs.revision }}" | tee plan-output.txt

      - name: run
        id: run
        run: |
          set +e
          ./forge run --base "${{ steps.base.outputs.revision }}" | tee run-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # exits non-zero when a task failed; the job's own failure is decided by the final step, so
      # this must not short-circuit the uploads and the PR comment that report *why* it failed.
      - name: build machine-readable summary
        continue-on-error: true
        run: |
          python3 .github/scripts/forgeci-summary.py \
            plan-output.txt run-output.txt "${{ steps.base.outputs.revision }}" forgeci-summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgeci-summary
          path: |
            forgeci-summary.json
            plan-output.txt
            run-output.txt

      # forge run reports a task as failed but not which test inside it failed — the JUnit XML is
      # the only way to diagnose a failure that reproduces on CI's platform and not on a developer's.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore

      - name: comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('forgeci-summary.json', 'utf8'));
            const plan = summary.plan.counts;
            const run = summary.run.counts;
            const status = summary.ok ? '✅' : '❌';
            const body = [
              `${status} **ForgeCI plan vs \`${summary.base_revision.slice(0, 12)}\`**`,
              '',
              `Plan: ${plan.run} run, ${plan.cached} cached, ${plan.unaffected} unaffected`,
              `Result: ${run.succeeded} succeeded, ${run.failed} failed, ${run.skipped} skipped in ${run.wall_clock ?? 'n/a'}`,
              '',
              `Full summary: see the \`forgeci-summary\` workflow artifact on this run.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '**ForgeCI plan vs';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: fail the job if any task failed
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
