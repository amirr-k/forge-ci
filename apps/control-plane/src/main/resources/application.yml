spring:
  application:
    name: cnba-control-plane
  datasource:
    url: ${CNBA_DB_URL:jdbc:mysql://localhost:3306/cnba}
    username: ${CNBA_DB_USER:cnba}
    password: ${CNBA_DB_PASSWORD:cnba}
    # MySQL's default REPEATABLE READ keeps a transaction's plain (non-locking) reads pinned to
    # the snapshot from its first query, even after that same transaction takes a row lock
    # elsewhere (e.g. SELECT ... FOR UPDATE) — so a caller that blocked on a lock and then reads
    # again (build-event sequence allocation, task-attempt numbering) can still see pre-lock data.
    # READ COMMITTED makes every statement see the latest committed data, which every locking
    # pattern in the control plane already assumes.
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:migrations
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${CNBA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cnba-control-plane
      auto-offset-reset: earliest
    producer:
      acks: all
  data:
    redis:
      host: ${CNBA_REDIS_HOST:localhost}
      port: ${CNBA_REDIS_PORT:6379}

server:
  port: ${CNBA_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true

cnba:
  # set by the release pipeline's image build/deploy step (docs/architecture.md), read back by
  # /api/version — never derived from a .git directory, which a deployed jar doesn't have
  git-commit: ${CNBA_GIT_COMMIT:unknown}
  worker:
    # a worker is declared dead after 3 missed heartbeats, and declaring it dead is what reclaims
    # its in-flight attempts — so this, not the task's own timeout, sets crash-recovery latency
    heartbeat-interval-ms: ${CNBA_WORKER_HEARTBEAT_INTERVAL_MS:2000}
  scheduler:
    policy: ${CNBA_SCHEDULER_POLICY:critical-path}
    # the lease deadline is the task's declared timeout plus this grace. It is the backstop for a
    # worker that is unreachable but still heartbeating; the heartbeat path above is what normally
    # detects a crash, so this stays generous rather than racing legitimate long tasks.
    lease-grace-seconds: ${CNBA_SCHEDULER_LEASE_GRACE_SECONDS:30}
    lease-sweep-interval-ms: ${CNBA_SCHEDULER_LEASE_SWEEP_INTERVAL_MS:2000}
    # reclaimed leases skip the exponential failure backoff — see SchedulerService
    reclaim-retry-delay-ms: ${CNBA_SCHEDULER_RECLAIM_RETRY_DELAY_MS:1000}
    retry-sweep-interval-ms: ${CNBA_SCHEDULER_RETRY_SWEEP_INTERVAL_MS:1000}
    duration-history-limit: ${CNBA_SCHEDULER_DURATION_HISTORY_LIMIT:2000}
    default-task-estimate-ms: ${CNBA_SCHEDULER_DEFAULT_TASK_ESTIMATE_MS:1000}
    speculation:
      # off by default: it trades duplicated work for tail latency, which is only worth it on a
      # cluster with idle capacity and a real straggler problem. Benchmarked both ways.
      enabled: ${CNBA_SCHEDULER_SPECULATION_ENABLED:false}
      multiplier: ${CNBA_SCHEDULER_SPECULATION_MULTIPLIER:1.5}
      min-elapsed-ms: ${CNBA_SCHEDULER_SPECULATION_MIN_ELAPSED_MS:5000}
      max-per-build: ${CNBA_SCHEDULER_SPECULATION_MAX_PER_BUILD:4}
  redis:
    reconcile-interval-ms: ${CNBA_REDIS_RECONCILE_INTERVAL_MS:15000}
  demo:
    # local dev/tests run with the working directory at the repo root, where the bundled repo
    # lives at its normal path; deploy/compose.yaml points these at the paths baked into the
    # control-plane image (see apps/control-plane/Dockerfile) instead.
    repo-path: ${CNBA_DEMO_REPO_PATH:demo/sample-monorepo}
    workspace-path: ${CNBA_DEMO_WORKSPACE_PATH:build/demo-workspace}
  build-history:
    default-page-size: 20
    max-page-size: 100
  artifacts:
    cleanup-interval-ms: ${CNBA_ARTIFACT_CLEANUP_INTERVAL_MS:900000}
    s3:
      bucket: ${CNBA_S3_BUCKET:cnba-artifacts}
      region: ${CNBA_S3_REGION:us-east-1}
      endpoint-override: ${CNBA_S3_ENDPOINT:}
      path-style-access: ${CNBA_S3_PATH_STYLE:true}
      access-key: ${CNBA_S3_ACCESS_KEY:}
      secret-key: ${CNBA_S3_SECRET_KEY:}
      temp-prefix: tmp/
      object-prefix: artifacts/
      temp-ttl: ${CNBA_S3_TEMP_TTL:PT1H}
