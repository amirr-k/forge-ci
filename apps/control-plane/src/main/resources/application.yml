spring:
  application:
    name: forge-control-plane
  datasource:
    url: ${FORGE_DB_URL:jdbc:mysql://localhost:3306/forgeci}
    username: ${FORGE_DB_USER:forgeci}
    password: ${FORGE_DB_PASSWORD:forgeci}
    # MySQL's default REPEATABLE READ keeps a transaction's plain (non-locking) reads pinned to
    # the snapshot from its first query, even after that same transaction takes a row lock
    # elsewhere (e.g. SELECT ... FOR UPDATE) — so a caller that blocked on a lock and then reads
    # again (build-event sequence allocation, task-attempt numbering) can still see pre-lock data.
    # READ COMMITTED makes every statement see the latest committed data, which every locking
    # pattern in the control plane already assumes.
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:migrations
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${FORGE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: forge-control-plane
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: ${FORGE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true

forge:
  build-history:
    default-page-size: 20
    max-page-size: 100
  artifacts:
    cleanup-interval-ms: ${FORGE_ARTIFACT_CLEANUP_INTERVAL_MS:900000}
    s3:
      bucket: ${FORGE_S3_BUCKET:forgeci-artifacts}
      region: ${FORGE_S3_REGION:us-east-1}
      endpoint-override: ${FORGE_S3_ENDPOINT:}
      path-style-access: ${FORGE_S3_PATH_STYLE:true}
      access-key: ${FORGE_S3_ACCESS_KEY:}
      secret-key: ${FORGE_S3_SECRET_KEY:}
      temp-prefix: tmp/
      object-prefix: artifacts/
      temp-ttl: ${FORGE_S3_TEMP_TTL:PT1H}
